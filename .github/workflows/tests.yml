name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install dependencies (hash-verified)
        run: pip install --require-hashes -r requirements.lock.txt

      - name: Audit installed dependencies for known vulnerabilities
        run: |
          pip install --require-hashes -r requirements-ci.lock.txt
          pip-audit -r requirements.lock.txt --strict

      - name: Byte-compile the main pipeline
        run: python -m py_compile cve_pipeline.py cve_watcher.py src/pipeline/patch.py src/labs/exploit_templates.py browser_xss_replay.py

      - name: Run tests
        run: python -m pytest tests/ -v
