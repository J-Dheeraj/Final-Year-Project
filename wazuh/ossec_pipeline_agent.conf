<!--
  Wazuh agent configuration snippet for the FYP CVE pipeline.

  USAGE (WSL2 Ubuntu):
    Merge this block into /var/ossec/etc/ossec.conf inside <ossec_config>
    then restart: sudo systemctl restart wazuh-agent

  What this configures:
    1. Log collection  — tail logs/pipeline.log (host log file)
    2. FIM             — real-time file integrity on the entire fyp/ tree
    3. Docker listener — capture container spawn/stop/exec events
-->

<!-- ── 1. Log file collection ───────────────────────────────────────────── -->
<localfile>
  <log_format>syslog</log_format>
  <!-- Adjust to the absolute Linux path of your fyp checkout -->
  <location>/home/dheer/fyp/logs/pipeline.log</location>
</localfile>

<!-- ── 2. File integrity monitoring ─────────────────────────────────────── -->
<syscheck>
  <!-- Real-time FIM: catches poc.py writes, .pipeline_lessons.json updates,
       ppc temp files (poc.ppc_*.py), and target_app changes -->
  <directories realtime="yes" report_changes="yes" check_all="yes">
    /home/dheer/fyp
  </directories>

  <!-- Ignore Python bytecode and git object store (high churn, low signal) -->
  <ignore>/home/dheer/fyp/.git</ignore>
  <ignore type="sregex">\.pyc$</ignore>
  <ignore type="sregex">__pycache__</ignore>
</syscheck>

<!-- ── 3. Docker event monitoring ───────────────────────────────────────── -->
<wodle name="docker-listener">
  <interval>10s</interval>
  <attempts>5</attempts>
  <run_on_start>yes</run_on_start>
  <disabled>no</disabled>
</wodle>
